[package]
name = "apollo-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false
repository = "https://github.com/Apollo-Deploy/apollo-agent"
readme = "README.md"
description = "Provider-neutral Linux node telemetry agent"

[dependencies]
apollo-domain = { path = "crates/apollo-domain", version = "=0.1.0" }
apollo-telemetry-protocol = { path = "crates/apollo-telemetry-protocol", version = "=0.1.0" }
apollo-node-telemetry-protocol = { path = "crates/apollo-node-telemetry-protocol", version = "=0.1.0" }
async-nats = { version = "=0.50.0", default-features = false, features = ["nkeys", "ring"] }
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
nkeys = "=0.4.5"
prost = "=0.14.3"
rustix = { version = "=1.1.5", features = ["event", "fs", "net", "process"] }
ciborium = "=0.2.2"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
sha2 = "=0.10.9"
thiserror = "=2.0.18"
tokio = { version = "=1.53.1", default-features = false, features = ["io-util", "macros", "net", "rt", "signal", "sync", "time"] }
uuid = { version = "=1.20.0", default-features = false, features = ["std", "v4"] }
zeroize = "=1.9.0"

[dev-dependencies]
base64 = "=0.22.1"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
[lints.clippy]
correctness = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[workspace]
resolver = "3"
members = ["crates/apollo-telemetry-protocol", "crates/apollo-node-telemetry-protocol", "crates/apollo-domain"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
publish = false

[workspace.dependencies]
crc32fast = "=1.5.2"
ed25519-dalek = { version = "=2.2.0", default-features = false, features = ["std", "zeroize"] }
prost = "=0.14.3"
prost-build = "=0.14.3"
protoc-bin-vendored = "=3.2.0"
thiserror = "=2.0.18"

[workspace.lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"
[workspace.lints.clippy]
correctness = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
